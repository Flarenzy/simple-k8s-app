apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ipam.apiFullname" . }}
  labels:
    {{- include "ipam.apiLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ipam.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ipam.apiLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ ternary (include "ipam.discoveryServiceAccountName" .) (include "ipam.serviceAccountName" .) .Values.api.kubernetesDiscovery.enabled }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: DB_CONN
              {{- if or .Values.db.existingSecret .Values.db.connString }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ipam.dbSecretName" . }}
                  key: DB_CONN
              {{- else }}
              value: ""
              {{- end }}
            - name: PORT
              value: {{ .Values.api.env.PORT | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: AUTH_ENABLED
              value: {{ ternary "true" "false" .Values.api.auth.enabled | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.api.auth.issuer | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.api.auth.audience | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.api.auth.jwksURL | quote }}
            - name: KUBERNETES_DISCOVERY_ENABLED
              value: {{ ternary "true" "false" .Values.api.kubernetesDiscovery.enabled | quote }}
            - name: KUBERNETES_DISCOVERY_SOURCE_KEY
              value: {{ .Values.api.kubernetesDiscovery.sourceKey | quote }}
            - name: KUBERNETES_DISCOVERY_SOURCE_NAME
              value: {{ .Values.api.kubernetesDiscovery.sourceName | quote }}
            - name: KUBERNETES_DISCOVERY_SITE_ID
              value: {{ .Values.api.kubernetesDiscovery.siteID | quote }}
            - name: KUBERNETES_DISCOVERY_AUTH_MODE
              value: "in_cluster"
            - name: KUBERNETES_DISCOVERY_NAMESPACES
              value: {{ join "," .Values.api.kubernetesDiscovery.namespaces | quote }}
            - name: KUBERNETES_DISCOVERY_CLUSTER_DOMAIN
              value: {{ .Values.api.kubernetesDiscovery.clusterDomain | quote }}
            - name: KUBERNETES_DISCOVERY_INTERVAL
              value: {{ .Values.api.kubernetesDiscovery.interval | quote }}
            - name: KUBERNETES_DISCOVERY_REQUEST_TIMEOUT
              value: {{ .Values.api.kubernetesDiscovery.requestTimeout | quote }}
            - name: KUBERNETES_DISCOVERY_STALE_RETENTION
              value: {{ .Values.api.kubernetesDiscovery.staleRetention | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
