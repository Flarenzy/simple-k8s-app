{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "ipam.fullname" . -}}
{{- $apiName := include "ipam.apiFullname" . -}}
{{- $feName := include "ipam.feFullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-fe
  labels:
    {{- include "ipam.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.frontend.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.frontend.path | quote }}
      backendRefs:
        - name: {{ $feName }}
          port: {{ .Values.fe.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "ipam.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.api.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.api.path | quote }}
      backendRefs:
        - name: {{ $apiName }}
          port: {{ .Values.api.service.port }}
{{- end }}
